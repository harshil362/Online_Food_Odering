<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Details | FoodieHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=150&q=80" alt="FoodieHub logo" class="brand-logo" />
          <div class="brand-text">
            <span class="brand-name">FoodieHub</span>
            <span class="brand-tagline">Fresh meals, fast delivery</span>
          </div>
        </a>
        <button class="navbar-toggler" type="button" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <a class="nav-link position-relative" href="cart.html">
              <i class="fa-solid fa-shopping-cart fa-lg"></i>
              <span class="cart-badge">0</span>
            </a>
            <div id="authAction"></div>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div id="foodDetails"></div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="row g-4 align-items-center">
          <div class="col-md-6">
            <h5>FoodieHub</h5>
            <p class="text-light-emphasis">Fresh meals made for your cravings and delivered fast.</p>
            <div class="d-flex gap-3 fs-5 mt-3">
              <a href="#"><i class="fa-brands fa-facebook"></i></a>
              <a href="#"><i class="fa-brands fa-instagram"></i></a>
              <a href="#"><i class="fa-brands fa-twitter"></i></a>
            </div>
          </div>
          <div class="col-md-6">
            <h5>Stay updated</h5>
            <p class="text-light-emphasis">Subscribe for new menu items and exclusive offers.</p>
            <form class="footer-newsletter d-flex flex-column flex-sm-row align-items-stretch gap-2" onsubmit="event.preventDefault(); showToast('Thanks for subscribing!');">
              <input type="email" class="form-control" placeholder="Email address" required />
              <button class="btn btn-orange" type="submit">Subscribe</button>
            </form>
          </div>
        </div>
      </div>
    </footer>

    <div id="toastMessage" class="toast align-items-center text-bg-dark border-0 position-fixed bottom-0 end-0 m-3" role="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
